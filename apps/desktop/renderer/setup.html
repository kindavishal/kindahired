<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <main>
    <header>
      <h1 id="title">Connect Claude</h1>
      <p class="lede" id="lede">kindahired builds your packs and research with Claude Code, on your own Claude plan.</p>
    </header>

    <section class="card" aria-labelledby="claude-title">
      <h2 id="claude-title">Claude Code</h2>
      <p id="claude-status" class="status" aria-live="polite">Checking…</p>
      <p id="claude-detail" class="hint"></p>
      <div class="actions">
        <button type="button" id="install" class="primary" hidden>Get Claude Code</button>
        <button type="button" id="claude-again" class="secondary">Check again</button>
      </div>
    </section>

    <section class="card" id="account" hidden>
      <label class="check">
        <input id="login" type="checkbox">
        <span>Open when I log in</span>
      </label>
      <div class="actions">
        <button type="button" id="sign-out" class="secondary">Sign out</button>
      </div>
    </section>

    <footer>
      <button type="button" id="dashboard" class="link">Open kindahired</button>
      <span id="version"></span>
    </footer>
  </main>
  <script src="setup.js"></script>
</body>
</html>
